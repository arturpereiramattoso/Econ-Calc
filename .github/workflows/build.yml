name: Build Native Windows 11 ARM64 Binary (econ-calc)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows-arm64:
    name: Compile aarch64-pc-windows-msvc Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Build Optimized Native ARM64 Release Binary
        shell: pwsh
        run: cargo build --release --target aarch64-pc-windows-msvc

      - name: Upload Native Windows 11 ARM64 Executable
        uses: actions/upload-artifact@v4
        with:
          name: econ-calc-windows-11-arm64
          path: target/aarch64-pc-windows-msvc/release/econ-calc.exe
