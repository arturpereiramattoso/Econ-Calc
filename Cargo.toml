[package]
name = "econ-calc"
version = "1.0.0"
edition = "2021"
authors = ["Principal Systems Economist"]
description = "High-performance native computational economics IDE"
license = "MIT"

[dependencies]
eframe = { version = "0.28.1", default-features = true }
egui = { version = "0.28.1", features = ["default_fonts"] }
egui_extras = "0.28.1"
egui_plot = "0.28.1"
nalgebra = "0.33.0"
meval = "0.2"
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
