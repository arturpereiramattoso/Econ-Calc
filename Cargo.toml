[package]
name = "econ-calc"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
authors = ["Principal Systems Economist <architect@econ-calc.local>"]
description = "High-performance native mathematical workspace and computational economics IDE for Windows 11 ARM64"
license = "MIT OR Apache-2.0"

[dependencies]
eframe = { version = "0.37.0", default-features = true }
egui = { version = "0.37.0", features = ["default_fonts"] }
egui_extras = "0.37.0"
egui_plot = "0.38.0"
nalgebra = "0.35.0"
meval = "0.2"
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

3. src/main.rs
#![cfg_attr(not(debug_assertions), windows_subsystem = "windows")]

mod app;
mod exporter;

use app::EconCalcApp;
use eframe::egui;

fn main() -> eframe::Result<()> {
    let viewport = egui::ViewportBuilder::default()
        .with_title("econ-calc — Positron Computational Economics & Mathematical IDE (ARM64)")
        .with_inner_size([1520.0, 920.0])
        .with_min_inner_size([1080.0, 680.0]);

    let native_options = eframe::NativeOptions {
        viewport,
        ..Default::default()
    };

    eframe::run_native(
        "econ-calc",
        native_options,
        Box::new(|cc| Ok(Box::new(EconCalcApp::new(cc)))),
    )
}